    <style>
        .footer {
  text-align: center;
  padding: 10px 0;
  background-color: #f0f0f0;
}
        .c-header {
  background-color: #f0f0f0; /* Light gray background */
  padding: 20px 0; /* Some top and bottom padding */
 
}

.c-header__bottom-grid {
  display: flex; /* Enable flexbox for alignment */
  justify-content: center; /* Center content horizontally */
}

.c-branding__title {
  margin: 0; /* Remove default margin */
  color: #333; /* Dark gray text color */
  font-size: 2em; /* Slightly larger font size */
  font-weight: bold; /* Make it bold */
}

.c-branding__title span {
  display: block; /* Ensure span takes full width if needed for further styling */
}
        

        #pie,
        #colChart,
        #map,
        #visitorsChart,
        #pieChart {
            width: 100%;
            height: 100%;
        }

        .header {
            border-bottom: 1px solid rgba(0, 0, 0, 0.12);
            height: 50px;
            position: relative;
        }

        .e-dashboardlayout.e-control .e-panel .e-panel-container .e-panel-header {
            border-bottom: 2px solid #e6e9ed !important;
            /* height: 35px; */

            padding: 0 15px 0 15px;
            line-height: 35px;
        }

        #sidebar-section {

            padding: 0px !important;
            border: 1px solid rgba(0, 0, 0, 0.12);
        }

        .fluent2-dark #sidebar-section,
        .fluent2-highcontrast #sidebar-section {
            border: 1px solid var(--color-sf-border-light);
        }

        .fluent2-dark .header,
        .fluent2-highcontrast .header {
            border-bottom: 1px solid var(--color-sf-border-light);
        }

        .fluent-dark .card-content.text,
        .fluent2-dark .card-content.text,
        .fluent2-highcontrast .card-content.text,
        .bootstrap5-dark .card-content.text,
        .tailwind-dark .card-content.text,
        .tailwind3-dark .card-content.text,
        .material-dark .card-content.text,
        .bootstrap-dark .card-content.text,
        .highcontrast .card-content.text {
            color: #ffffff;
        }

        .fabric-dark .card-content.text {
            color: #dadada
        }

        .e-bigger #search {
            display: none;
        }

        @media (max-width: 650px) {
            .e-bigger .searchContent {
                display: none;
            }

            .information {
                right: 17% !important;
            }

            #pieChart,
            #colChart,
            #visitorsChart,
            #pie,
            #map {
                width: 100% !important;
                height: 100% !important;
            }
        }

    <script>

        let test_result = [

        function createChart(id, data, chartType, title = "Titleee") {
            // console.log(data)
            let root = am5.Root.new(id);
            root.setThemes([am5themes_Animated.new(root)]);

            let chart;
            let series;
            switch (chartType.toLowerCase()) {

                case 'column':
                    chart = root.container.children.push(am5xy.XYChart.new(root, {
                        panX: true,
                        panY: true,
                        wheelX: "panX",
                        wheelY: "zoomX",
                        pinchZoomX: true,
                        paddingLeft: 0,
                        paddingRight: 1
                    }));

                    let cursor = chart.set("cursor", am5xy.XYCursor.new(root, {}));
                    cursor.lineY.set("visible", false);

                    let xRenderer = am5xy.AxisRendererX.new(root, {
                        minGridDistance: 30,
                        minorGridEnabled: true
                    });

                    xRenderer.labels.template.setAll({
                        rotation: -90,
                        centerY: am5.p50,
                        centerX: am5.p100,
                        paddingRight: 15
                    });

                    xRenderer.grid.template.setAll({ location: 1 });

                    let xAxisCol = chart.xAxes.push(am5xy.CategoryAxis.new(root, {
                        maxDeviation: 0.3,
                        categoryField: "country",
                        renderer: xRenderer,
                        tooltip: am5.Tooltip.new(root, {})
                    }));

                    let yRenderer = am5xy.AxisRendererY.new(root, { strokeOpacity: 0.1 });
                    let yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, {
                        maxDeviation: 0.3,
                        renderer: yRenderer
                    }));

                    series = chart.series.push(am5xy.ColumnSeries.new(root, {
                        name: title,
                        xAxis: xAxisCol,
                        yAxis: yAxis,
                        valueYField: "value",
                        sequencedInterpolation: true,
                        categoryXField: "country",
                        tooltip: am5.Tooltip.new(root, { labelText: "{valueY}" })
                    }));

                    series.columns.template.setAll({
                        cornerRadiusTL: 5,
                        cornerRadiusTR: 5,
                        strokeOpacity: 0
                    });

                    xAxisCol.data.setAll(data);
                    series.data.setAll(data);
                    break;

                case 'pie':
                    chart = root.container.children.push(am5percent.PieChart.new(root, {
                        layout: root.verticalLayout
                    }));

                    series = chart.series.push(am5percent.PieSeries.new(root, {
                        valueField: "value",
                        categoryField: "country",
                        tooltip: am5.Tooltip.new(root, {
                            labelText: "{category}: {value} ({valuePercentTotal}%)"
                        })
                    }));

                    series.slices.template.set("strokeOpacity", 0);
                    series.slices.template.set("fillOpacity", 0.8);
                    series.data.setAll(data);
                    break;

                case 'gauge':
                    chart = root.container.children.push(am5radar.RadarChart.new(root, {
                        panX: false,
                        panY: false,
                        wheelX: "panX",
                        wheelY: "zoomX",
                        innerRadius: am5.percent(20),
                        startAngle: -90,
                        endAngle: 180
                    }));

                    let gaugeCursor = chart.set("cursor", am5radar.RadarCursor.new(root, {
                        behavior: "zoomX"
                    }));
                    gaugeCursor.lineY.set("visible", false);

                    let xRendererGauge = am5radar.AxisRendererCircular.new(root, {});
                    xRendererGauge.labels.template.setAll({ radius: 10 });
                    xRendererGauge.grid.template.setAll({ forceHidden: true });

                    let xAxisGauge = chart.xAxes.push(am5xy.ValueAxis.new(root, {
                        renderer: xRendererGauge,
                        min: 0,
                        max: 100,
                        strictMinMax: true,
                        numberFormat: "#'%'",
                        tooltip: am5.Tooltip.new(root, {})
                    }));

                    let yRendererGauge = am5radar.AxisRendererRadial.new(root, {
                        minGridDistance: 20
                    });

                    yRendererGauge.labels.template.setAll({
                        centerX: am5.p100,
                        fontWeight: "500",
                        fontSize: 18
                    });

                    yRendererGauge.grid.template.setAll({ forceHidden: true });

                    let yAxisGauge = chart.yAxes.push(am5xy.CategoryAxis.new(root, {
                        categoryField: "category",
                        renderer: yRendererGauge
                    }));

                    let series1 = chart.series.push(am5radar.RadarColumnSeries.new(root, {
                        xAxis: xAxisGauge,
                        yAxis: yAxisGauge,
                        clustered: false,
                        valueXField: "full",
                        categoryYField: "category",
                        fill: root.interfaceColors.get("alternativeBackground")
                    }));

                    series1.columns.template.setAll({
                        width: am5.p100,
                        fillOpacity: 0.08,
                        strokeOpacity: 0,
                        cornerRadius: 20
                    });

                    series = chart.series.push(am5radar.RadarColumnSeries.new(root, {
                        xAxis: xAxisGauge,
                        yAxis: yAxisGauge,
                        clustered: false,
                        valueXField: "value",
                        categoryYField: "category"
                    }));

                    series.columns.template.setAll({
                        width: am5.p100,
                        strokeOpacity: 0,
                        tooltipText: "{category}: {valueX}%",
                        cornerRadius: 20
                    });

                    yAxisGauge.data.setAll(data);
                    series1.data.setAll(data);
                    series.data.setAll(data);
                    break;

                case 'clockgauge':
                    chart = root.container.children.push(
                        am5radar.RadarChart.new(root, {
                            panX: false,
                            panY: false,
                            startAngle: 180,
                            endAngle: 360
                        })
                    );

                    chart.getNumberFormatter().set("numberFormat", "#'%'");

                    // Create axis and its renderer
                    let axisRenderer = am5radar.AxisRendererCircular.new(root, {
                        innerRadius: -40
                    });

                    axisRenderer.grid.template.setAll({
                        stroke: root.interfaceColors.get("background"),
                        visible: true,
                        strokeOpacity: 0.8
                    });

                    let xAxis = chart.xAxes.push(
                        am5xy.ValueAxis.new(root, {
                            maxDeviation: 0,
                            min: 0,
                            max: 100,
                            strictMinMax: true,
                            renderer: axisRenderer
                        })
                    );

                    // Add clock hand
                    let axisDataItem = xAxis.makeDataItem({});

                    let clockHand = am5radar.ClockHand.new(root, {
                        pinRadius: 50,
                        radius: am5.percent(100),
                        innerRadius: 50,
                        bottomWidth: 0,
                        topWidth: 0
                    });

                    clockHand.pin.setAll({
                        fillOpacity: 0,
                        strokeOpacity: 0.5,
                        stroke: am5.color(0x000000),
                        strokeWidth: 1,
                        strokeDasharray: [2, 2]
                    });

                    clockHand.hand.setAll({
                        fillOpacity: 0,
                        strokeOpacity: 0.5,
                        stroke: am5.color(0x000000),
                        strokeWidth: 0.5
                    });

                    let bullet = axisDataItem.set(
                        "bullet",
                        am5xy.AxisBullet.new(root, {
                            sprite: clockHand
                        })
                    );

                    xAxis.createAxisRange(axisDataItem);

                    let label = chart.radarContainer.children.push(
                        am5.Label.new(root, {
                            centerX: am5.percent(50),
                            textAlign: "center",
                            centerY: am5.percent(50),
                            fontSize: "1.5em"
                        })
                    );

                    // Set initial value from data (assuming data[0].value is the percentage)
                    // console.log(data[0])
                    const initialValue = data[0] || 50;
                    axisDataItem.set("value", initialValue);
                    bullet.get("sprite").on("rotation", function () {
                        var value = axisDataItem.get("value");
                        label.set("text", Math.round(value).toString() + "%");
                    });

                    // Color ranges
                    chart.bulletsContainer.set("mask", undefined);
                    let colorSet = am5.ColorSet.new(root, {});

                    let axisRange0 = xAxis.createAxisRange(
                        xAxis.makeDataItem({
                            above: true,
                            value: 0,
                            endValue: initialValue
                        })
                    );

                    axisRange0.get("axisFill").setAll({
                        visible: true,
                        fill: colorSet.getIndex(0)
                    });

                    axisRange0.get("label").setAll({
                        forceHidden: true
                    });

                    let axisRange1 = xAxis.createAxisRange(
                        xAxis.makeDataItem({
                            above: true,
                            value: initialValue,
                            endValue: 100
                        })
                    );

                    axisRange1.get("axisFill").setAll({
                        visible: true,
                        fill: colorSet.getIndex(4)
                    });

                    axisRange1.get("label").setAll({
                        forceHidden: true
                    });

                    // Store references for updates
                    series = {
                        axisDataItem: axisDataItem,
                        axisRange0: axisRange0,
                        axisRange1: axisRange1,
                        label: label
                    };
                    break;


            }
            // console.log("Chart")

            return [chart, series]


        }

                        setTimeout(function () {

            // Update the dashboard panels and re-render

                                                    country: item.country,

                                                })
