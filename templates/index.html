<!DOCTYPE HTML>
<html>

<head>
	<title>CliniPredict</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="../static/assets/css/main.css" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

	<style>

		#actionButtons {
			display: none;
			margin-top: 20px;
		}

		#mynetwork {
			position: absolute;
			height: 650px;
			height: 100vh;
			width: 100vh;
			left: 400px;
		}

		.cont {
			position: relative;
			z-index: 1;
			/* height: 650px; */
			top: 25em;

		}

		.stage {
			font-weight: 500;
			margin-top: 10px;
			font-size: 1.1rem;
		}

		.icon-margin {
			margin-right: 8px;
		}
		.footer {
  text-align: center;
  padding: 10px 0;
  background-color: #f0f0f0;
}
	</style>
</head>

<body>

	<!-- Header -->
	<section id="header" class="dark ">
		<div id="mynetwork"></div>
		<div class="position-relative z-1">
			<header>
				<h1>CliniPredict</h1>
				<p>Powered by Agentic AI</p>
			</header>
		</div>

		<div class="cont">
			<footer>
				<a href="#first" class="button scrolly" id="startButton">Get Started</a>
			</footer>
		</div>
	</section>

	<!-- First -->
	<section id="first" class="main">
		<header>
			<div class="container">
				<div class="progress" style="height: 30px;">
					<div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0"
						aria-valuemin="0" aria-valuemax="100">0%</div>
				</div>
				<div class="mt-3 stage" id="currentStage">Initializing...</div>

				<!-- Action Buttons (Hidden Initially) -->
				<div id="actionButtons" class="text-center">
					<a href="/feedback" class="btn btn-primary m-2">View Stored Data</a>
					<a href="/dashboard" class="btn btn-success m-2">View Analysis</a>
				</div>
			</div>
		</header>
	</section>
	<span class="footer">
        <p>© 2025 CliniPredict. All Rights Reserved.</p>
    </span>

	<script src="https://visjs.github.io/vis-network/standalone/umd/vis-network.min.js"></script>
	<script>
		const patientFields = [
			"accessibilityScore",
			"trafficDensity",
			"satisfactionScores",
			"billingIssues",
			"dischargeProcess"
		];

		const staffFields = [
			"Workload",
			"Hospital Culture",
			"JobSatisfaction"
		];

		const stages = [
			{ label: "Starting Instance", icon: "bi-cpu", class: "text-primary" },
			{ label: "Starting Agents", icon: "bi-cpu", class: "text-primary" },
			{ label: "Collecting Feedback Data", icon: "bi-cloud-arrow-down", class: "text-info" },
			{ label: "Collecting Patients Feedback", icon: "bi-cloud-arrow-down", class: "text-info" },
			{ label: "Collecting Doctors/Staff Feedback", icon: "bi-cloud-arrow-down", class: "text-info" },
			...patientFields.map(item => ({
				label: `Extracting: ${item}`,
				class: "text-warning",
				spinnerOnly: true,
				delay: 2000
			})),
			...staffFields.map(item => ({
				label: `Extracting: ${item}`,
				class: "text-warning",
				spinnerOnly: true,
				delay: 2000
			})),
			{ label: "Storing Feedback Data", icon: "bi-hdd", class: "text-success", delay: 3000 }
		];

		const progressBar = document.getElementById("progressBar");
		const stageText = document.getElementById("currentStage");
		const actionButtons = document.getElementById("actionButtons");

		let currentStage = 0;

		function updateProgress() {
			if (currentStage < stages.length) {
				const stage = stages[currentStage];
				const percentage = ((currentStage + 1) / stages.length) * 100;

				progressBar.style.width = percentage + "%";
				progressBar.setAttribute("aria-valuenow", percentage);
				progressBar.textContent = Math.round(percentage) + "%";

				let html = `<span class="${stage.class}">`;

				if (stage.spinnerOnly) {
					html += `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>${stage.label}`;
				} else if (stage.icon) {
					html += `<i class="bi ${stage.icon} icon-margin"></i>${stage.label}`;
				} else {
					html += `${stage.label}`;
				}

				html += `</span>`;
				stageText.innerHTML = html;

				currentStage++;

				// Use custom delay if provided, else default to 1000ms
				const delay = stage.delay || 1000;
				setTimeout(updateProgress, delay);
			} else {
				stageText.innerHTML = `<span class="text-success"><i class="bi bi-check-circle-fill icon-margin"></i>📊 Data is ready to analyze</span>`;
				actionButtons.style.display = "block";
			}
		}

		document.getElementById("startButton").addEventListener("click", function () {
			setTimeout(() => {
				updateProgress();
			}, 500);
		});

		var DIR = "img/soft-scraps-icons/";

		var nodes = null;
		var edges = null;
		var network = null;

		// Called when the Visualization API is loaded.
		function draw() {
			// create people.
			// value corresponds with the age of the person
			var DIR = "../static/assets/css/images/";
			nodes = [
				{
					id: 1, shape: "circularImage",
					image: DIR + "1.png",

					label: "Servicenow Aggregator Agent",
					imagePadding: 20,
					x: -100,
					y: 800
				},
				{
					id: 2, shape: "circularImage",
					image: DIR + "googleforms.png",
					label: "Google forms aggregator agent",
					imagePadding: 20,
					x: -100,
					y: 600
				},
				{
					id: 3, shape: "circularImage",
					image: DIR + "microsoft.png",

					label: "M365 aggregator agent",
					imagePadding: 20,
					x: -100,
					y: 400
				},

				{
					id: 4, shape: "circularImage",
					image: DIR + "fb.png",

					label: "Facebook postaggregator agent",
					imagePadding: 20,
					x: -100,
					y: 200
				},

				{
					id: 6, shape: "circularImage",
					image: DIR + "insta.png",
					label: "Instagram content aggregator agent",
					imagePadding: 20,
					x: -100,
					y: 0
				},
				{
					id: 7, shape: "circularImage",
					image: DIR + "form.png",
					label: "Manual form aggregator agent",
					imagePadding: 20,
					x: -100,
					y: -200
				},
				{
					id: 8,
					shape: "circularImage",
					image: DIR + "2.png",
					label: "Datastore Agent",
					imagePadding: 20,

					x: 800,
					y: 300
				},
				{
					id: 9,
					shape: "circularImage",
					image: DIR + "4.png",
					label: "Analysis Agent",
					imagePadding: 20,

					x: 1450,
					y: 300
				},

			];

			// create connections between people
			// value corresponds with the amount of contact between two people
			edges = [
				{ from: 1, to: 8 },
				{ from: 2, to: 8 },
				{ from: 3, to: 8 },
				{ from: 4, to: 8 },
				{ from: 6, to: 8 },
				{ from: 7, to: 8 },
				{ from: 8, to: 9 },
			];

			// create a network
			var container = document.getElementById("mynetwork");
			var data = {
				nodes: nodes,
				edges: edges,
			};
			var options = {
				nodes: {
					size: 60,
					color: {
						border: "#222222",
						background: "#666666",
					},
					font: { size: 20, color: "#eeeeee" },



				},
				edges: {
					color: "lightgray",
				},
				interaction: {
					dragNodes: false,
					dragView: false,
					zoomView: false,
					hoverConnectedEdges: false,
					selectable: false,
					selectConnectedEdges: false,
				},
				physics: {
					enabled: false,
				},
			};
			network = new vis.Network(container, data, options);
		}

		window.addEventListener("load", () => {
			draw();
		});

	</script>

</body>

</html>
