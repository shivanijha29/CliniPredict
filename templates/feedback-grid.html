    <body>
      
            <header id="masthead" class="c-header">
                <div class="c-header__bottom">
                    <div class="container">
                        <div class="c-header__bottom-grid flex">
                            <div class="c-branding c-branding--header">

                            </div>
                    </div>

        <div style="margin: 1em 1em 0 1em; ">
            <div id="entityTabs">
                <div class="e-tab-header">
                    <div>Patients Feedback
                        <!-- <div id="patientFeedbackCount" class="tab-count">0</div> -->
                    </div>
                    <div>Doctors/Staff Feedback
                        <!-- <div id="staffFeedbackCount" class="tab-count">0</div> -->
                    </div>
                </div>
                <div class="e-content">
                    <div class="content-wrapper">
                        <div id="patientFeedback"></div>
                    </div>
                    <div class="content-wrapper">
                        <div id="staffFeedback"></div>
                    </div>
                </div>
            </div>
            <!-- <div style=" margin-bottom: 1em; margin-top: 1em;">
                <button type="button" class="btn btn-primary" href="/DataInsights">Start Agents</button>
                <button type="button" class="btn btn-secondary" href="/NLPWhisperer">Compliance Queries</button>
            </div> -->

        <span class="footer">

        </span>
        <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
        <script src=https://cdn.syncfusion.com/ej2/27.1.50/dist/ej2.min.js type="text/javascript"></script>
        <script src="../static/data-source.js" type="text/javascript"></script>
        <script>

            const myEntityTabObj = new ej.navigations.Tab({
                animation: {
                    previous: { effect: 'None', duration: 0, easing: '' },
                    next: { effect: 'None', duration: 0, easing: '' }
                },

            });
            myEntityTabObj.appendTo('#entityTabs');


            const staffFeedbackGrid = new ej.grids.Grid({
                dataSource: doctorsFeedbackData,

                // height: 600,
                allowSorting: true,
                // allowFiltering: true,
                allowPaging: true,
                pageSettings: { pageSize: 10 },
                queryCellInfo: staffqueryCellInfo,
                columns: [
                    { field: 'Workload', headerText: 'Workload', width: 90 },
                    { field: 'Compensation', headerText: 'Compensation', width: 100 },
                    { field: 'Accessibility', headerText: 'Accessibility', width: 100 },
                    { field: 'Sanitation', headerText: 'Sanitation', width: 100 },
                    { field: 'Hospital Culture', headerText: 'Hospital Culture', width: 100 },
                    { field: 'ESAT', headerText: 'ESAT', width: 100 },
                    { field: 'JobSatisfaction', headerText: 'JobSatisfaction', width: 100 },
                ]

            });
            staffFeedbackGrid.appendTo('#staffFeedback');


            function staffqueryCellInfo(args) {
                if (args.column.field === 'Accessibility') {
                    if (args.data['Accessibility'] < 3) {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                } else if (args.column.field === 'Workload') {
                    if (args.data['Workload'] < 5) {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                }
                else if (args.column.field === 'Compensation') {
                    if (args.data['Compensation'] < 3) {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                }
                else if (args.column.field === 'Sanitation') {
                    if (args.data['Sanitation'] < 3) {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                }
                else if (args.column.field === 'Hospital Culture') {
                    if (args.data['Hospital Culture'] < 3) {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                }
                else if (args.column.field === 'ESAT') {
                    if (args.data['ESAT'] < 5) {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                }
                else if (args.column.field === 'JobSatisfaction') {
                    if (args.data['JobSatisfaction'] < 3) {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                }

            }


            const patientFeedbackGrid = new ej.grids.Grid({
                dataSource: patientsFeedbackData,

                // height: 600,
                allowSorting: true,
                // allowFiltering: true,
                allowPaging: true,
                pageSettings: { pageSize: 10 },
                queryCellInfo: patientqueryCellInfo,
                columns: [
                    { field: 'communication', headerText: 'Communication', width: 80 },
                    { field: 'accessibilityScore', headerText: 'Accessibility Score', width: 90 },
                    { field: 'HAIs', headerText: 'HAIs', width: 50 },
                    { field: 'followThrough', headerText: 'Follow Through', width: 80 },
                    { field: 'trafficDensity', headerText: 'Traffic Density', width: 80 },
                    { field: 'waitingTimes', headerText: 'Waiting Time (min.)', width: 100 },
                    { field: 'NPS', headerText: 'NPS', width: 50 },
                    { field: 'billingIssues', headerText: 'Billing Issues', width: 80 },
                    { field: 'dischargeProcess', headerText: 'Discharge Process', width: 100 },
                    { field: 'satisfactionScores', headerText: 'Satisfaction Scores', width: 100 },
                ]

            });
            patientFeedbackGrid.appendTo('#patientFeedback');

            function patientqueryCellInfo(args) {
                if (args.column.field === 'communication') {
                    if (args.data['communication'] === "Low") {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else if (args.data['communication'] === "High") {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                } else if (args.column.field === 'accessibilityScore') {
                    if (args.data['accessibilityScore'] < 5) {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                }
                else if (args.column.field === 'HAIs') {
                    if (args.data['HAIs'] === "Yes") {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                }
                else if (args.column.field === 'followThrough') {
                    if (args.data['followThrough'] === "Low") {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else if (args.data['followThrough'] === "High") {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                }
                else if (args.column.field === 'trafficDensity') {
                    if (args.data['trafficDensity'] < 3) {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                }
                else if (args.column.field === 'waitingTimes') {
                    if (args.data['waitingTimes'] > 15) {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                }
                else if (args.column.field === 'NPS') {
                    if (args.data['NPS'] < 5) {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                }
                else if (args.column.field === 'billingIssues') {
                    if (args.data['billingIssues'] === 1) {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                }
                else if (args.column.field === 'dischargeProcess') {
                    if (args.data['dischargeProcess'] === "Poor") {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else if (args.data['dischargeProcess'] === "Good") {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                }
                else if (args.column.field === 'satisfactionScores') {
                    if (args.data['satisfactionScores'] === "Low") {
                        args.cell.classList.remove('e-increase');
                        args.cell.classList.add('e-decrease');
                    } else if (args.data['satisfactionScores'] === "High") {
                        args.cell.classList.remove('e-decrease');
                        args.cell.classList.add('e-increase');
                    }
                }

            }


        </script>
    </body>

</html>
